<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LGS Test Tool</title>
<link rel="stylesheet" href="/v2/static/fonts.css">
<link rel="stylesheet" href="/v2/static/app.css">
<style>
.cab{display:grid;gap:8px}.card.cab{grid-template-columns:minmax(0,1fr)}.cab h3{display:flex;gap:8px;align-items:center;justify-content:space-between}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.cabs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.evrow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.evrow .when{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}
.sitesrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.sitesrow{grid-template-columns:1.3fr 1.1fr 70px 100px 1fr 1fr auto;align-items:center}}
.sitesrow input,.sitesrow select{width:100%;min-height:40px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.siteshead{display:none}@media (min-width:900px){.siteshead{display:grid;border-bottom:1px solid var(--line)}}
.sitesrow select{min-height:40px;padding:0 8px}
.sitesrow.dup input[data-f=host]{border-color:var(--warn)}
.why{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;padding:0;min-height:0;border:1px solid var(--line);border-radius:50%;background:none;color:var(--muted);font-size:12px;line-height:1;cursor:pointer;vertical-align:middle}.why:hover{background:var(--surface2);color:var(--ink)}
@media (max-width:899px){.nav{display:flex;overflow-x:auto;scrollbar-width:none}.nav button{flex:0 0 auto;min-width:78px;padding:0 12px;font-size:13px;white-space:nowrap}}
#info,#settings,#ask,#pick{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);padding:18px;width:min(92vw,420px);box-shadow:0 12px 40px rgba(0,0,0,.35)}#info::backdrop,#settings::backdrop,#ask::backdrop,#pick::backdrop{background:rgba(8,12,18,.55)}#info h2,#settings h2{font-size:18px;margin:0}
.cmgrid{display:grid;gap:4px;align-items:center;margin-top:6px}
.cmrow{min-height:34px;padding:0 6px;border:0;background:none;color:var(--muted);font-size:12px;text-align:left}button.cmrow{cursor:pointer;border-radius:6px}button.cmrow:hover{background:var(--surface2)}
.cmcell{min-height:38px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);font:12px var(--mono);cursor:pointer}
.cmcell.on{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.cmcell.next{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.cmcell.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.cmcell.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.hubgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:6px}@media (max-width:599px){.hubgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}.hubcell{display:grid;gap:4px;font-size:13px;color:var(--muted)}.field label.chk{display:flex;align-items:center;gap:6px;height:auto;min-height:var(--tap);font-size:14px;color:var(--ink)}.field label.chk input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;margin:0;flex:none}.schdays{display:flex;flex-wrap:wrap;gap:4px 14px}.schgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}@media (max-width:599px){.schgrid{grid-template-columns:1fr}}.schrow{display:flex;align-items:center;gap:10px}.schrow .chk{flex:1}.field .schrow input[type=time]{width:130px;flex:none}.field .schrow input.off{opacity:.45}
.menu{position:relative}.menu>summary{list-style:none;cursor:pointer}.menu>summary::-webkit-details-marker{display:none}
.menupanel{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:230px;display:grid;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 12px 32px rgba(0,0,0,.25)}
@media (max-width:899px){.menupanel{left:0;right:auto;max-width:calc(100vw - 32px)}}
.menuitem{display:grid;gap:2px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;font-weight:600;text-align:left;text-decoration:none;cursor:pointer;box-sizing:border-box}
.menuitem small{font-weight:400;color:var(--muted);font-size:12px}.menuitem:hover{background:var(--surface2)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">LGS Test Tool<small id="ver"></small></div>
    <span class="chip warn" id="stagechip"></span>
    <div class="spacer"></div>
    <button class="btn sm" id="setbtn" type="button" aria-haspopup="dialog"></button>
  </header>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>
<dialog id="settings"><h2 id="settitle"></h2><div class="stack" style="margin-top:12px">
  <div class="field"><label id="langlbl"></label><select id="langsel"><option value="th">ไทย</option><option value="en">English</option></select></div>
  <div class="field"><label id="modelbl"></label><select id="modesel"></select></div>
  <div class="field"><label id="themelbl"></label><select id="themesel"></select></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="setclose"></button></div></dialog>
<dialog id="info"><div id="infobody"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="infoclose"></button></div></dialog>
<dialog id="pick"><h2 id="picktitle" style="margin:0 0 12px"></h2><div class="stack">
  <button class="btn primary" id="pickmerge" type="button" style="width:100%"></button>
  <button class="btn" id="pickreplace" type="button" style="width:100%;color:var(--bad)"></button>
  <button class="btn" id="pickno" type="button" style="width:100%"></button></div></dialog>
<dialog id="ask"><p id="asktext" style="white-space:pre-line;margin:0 0 14px"></p><input id="askin" type="text" autocomplete="off" hidden style="width:100%;box-sizing:border-box;margin:0 0 14px"><div class="row" style="justify-content:flex-end"><button class="btn" id="askno"></button><button class="btn primary" id="askok"></button></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/v2/static/app.js"></script>
</body>
</html>
