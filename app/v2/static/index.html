<style>

ive}.fgrp summary{height:var(--tap);box-sizing:border-box;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}.fgrp summary>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fgrp[open] summary{border-color:var(--brand)}.fgrp .fbody{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:290px;max-height:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:8px}.fgrp:nth-last-child(-n+2) .fbody{left:auto;right:0}}

.hubgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:6px}@media (max-width:599px){.hubgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}.hubcell{display:grid;gap:4px;font-size:13px;color:var(--muted)}.field label.chk{display:flex;align-items:center;gap:6px;height:auto;min-height:var(--tap);font-size:14px;color:var(--ink)}.field label.chk input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;margin:0;flex:none}#setsrv{gap:0}.setsec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.setsec input{width:100%;box-sizing:border-box;min-height:var(--tap);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px}.msub{background:var(--surface2);border-radius:12px;padding:12px;min-width:0}.msub h3{margin:0 0 8px}.msub .kv{margin:6px 0 0}.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px;align-items:stretch}.mgrid .mstats{grid-column:3;grid-row:1 / span 2}@media (max-width:899px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mgrid .mstats{grid-column:1 / -1;grid-row:auto}}@media (max-width:599px){.mgrid{grid-template-columns:1fr}}.sttab{width:100%;margin-top:8px;border-collapse:collapse;font-size:13px}.sttab th{text-align:left;color:var(--muted);font-weight:500}.sttab td,.sttab th{padding:4px 6px;border-bottom:1px solid var(--line)}#moddet>summary{list-style:none}#moddet>summary::-webkit-details-marker{display:none}#moddet>summary::before{content:'▸';color:var(--muted)}#moddet[open]>summary::before{content:'▾'}.seq{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}.seq4{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr)}.seqarr{color:var(--muted);padding-bottom:12px}@media (max-width:599px){.seq{grid-template-columns:1fr}.seqarr{display:none}}.insres{overflow:auto;border:1px solid var(--line);bo <body>
<div class="app">
  <header class="top">
    <button class="brandbtn" type="button" data-act="about" aria-label="THANES"><img class="brandlogo" src="/v2/static/thanes-icon.png" alt="THANES" width="30" height="30"></button>
    <div class="logo">LGS Test Tool<small id="ver"></small></div>
    <span class="chip warn" id="stagechip"></span>
    <div class="spacer"></div>
    <button class="btn sm" id="setbtn" type="button" aria-haspopup="dialog"></button>
  </header>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>
<dialog id="settings"><h2 id="settitle"></h2><div class="stack" style="margin-top:12px">
  <div class="field"><label id="langlbl"></label><select id="langsel"><option value="th">ไทย</option><option value="en">English</option></select></div>
  <div class="field"><label id="modelbl"></label><select id="modesel"></select></div>
  <div class="field"><label id="themelbl"></label><select id="themesel"></select></div><div id="setsrv" class="stack"></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="setclose"></button></div></dialog>
<dialog id="info"><div id="infobody"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="infoclose"></button></div></dialog>
<dialog id="pick"><h2 id="picktitle" style="margin:0 0 12px"></h2><div class="stack">
  <button class="btn primary" id="pickmerge" type="button" style="width:100%"></button>
  <button class="btn" id="pickreplace" type="button" style="width:100%;color:var(--bad)"></button>
  <button class="btn" id="pickno" type="button" style="width:100%"></button></div></dialog>
<dialog id="rptdlg"><h2 id="rpttitle" style="margin:0 0 12px"></h2><div id="rptbody" class="stack"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="rptcancel" type="button"></button><button class="btn primary" id="rptdl" data-act="rpt-download" type="button" hidden></button><button class="btn" id="rptclose" type="button"></button></div></dialog>
<dialog id="apdlg"><div class="row between" style="margin:0 0 12px;flex-wrap:nowrap;gap:8px"><h2 id="aptitle" style="margin:0"></h2><span id="aptag" class="small" style="padding:2px 10px;border-radius:999px;background:var(--surface2);white-space:nowrap"></span></div><div id="apbody" class="stack"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="apclose" data-act="ap-close" type="button"></button></div></dialog>
<dialog id="schedpick"><div class="row" style="margin:0 0 12px;gap:8px;flex-wrap:nowrap"><h2 id="sctitle" style="margin:0"></h2><button class="why" id="scinfo" data-act="ins-info" data-k="schedNote" type="button">?</button></div><div class="stack" id="scbody"></div><div class="row between" style="margin-top:14px"><button class="btn" id="scno" type="button"></button><button class="btn primary" id="scok" type="button"></button></div></dialog>
<dialog id="timepick"><h2 id="tmtitle" style="margin:0 0 12px"></h2><div class="stack" id="tmbody"></div><div class="small muted" id="tmhint" style="margin-top:10px"></div><div class="row between" style="margin-top:12px"><button class="btn" id="tmall" type="button"></button><button class="btn primary" id="tmno" type="button"></button></div></dialog>
<dialog id="rangepick"><div class="segctl" id="rpshort"></div><div class="row between" style="flex-wrap:nowrap;margin-bottom:10px"><button class="btn sm" id="rpprev" type="button" aria-label="‹">‹</button><b id="rptitle"></b><button class="btn sm" id="rpnext" type="button" aria-label="›">›</button></div><div class="calgrid" id="rpgrid"></div><div class="small muted" id="rphint" style="margin-top:10px"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="rpno" type="button"></button></div></dialog>
<dialog id="colorpick"><h2 id="colortitle" style="margin:0 0 12px"></h2><div class="colgrid" id="colorgrid"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="colorno" type="button"></button></div></dialog>
<dialog id="ask"><p id="asktext" style="white-space:pre-line;margin:0 0 14px"></p><input id="askin" type="text" autocomplete="off" hidden style="width:100%;box-sizing:border-box;margin:0 0 14px"><div class="row" style="justify-content:flex-end"><button class="btn" id="askno"></button><button class="btn primary" id="askok"></button></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/v2/static/dropdown.js"></script>
<script src="/v2/static/app.js"></script>
</body>
</html>
